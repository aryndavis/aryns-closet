# Supabase pauses free projects after a week without activity. This reads one row of
# public data twice a week so the project stays awake. It uses the same publishable key
# the website uses, so it can only read what visitors can already see.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 * * 1,4' # Mondays and Thursdays, 15:17 UTC
  workflow_dispatch:

permissions:
  actions: write # only for the last step, which keeps this schedule switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered HTTP $status"
          [ "$status" = 200 ]
      # GitHub turns off scheduled workflows in a repo with no activity for 60 days.
      # Re-enabling this workflow on every run keeps the schedule from lapsing.
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
